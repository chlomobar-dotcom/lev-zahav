<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="LEV ZAHAV — La Banque du Cœur">
  <!-- ============================================================
       LEV ZAHAV — Logo
       Deux mains cuppées + deux cœurs dorés
       Inspiration : logo officiel de l'association
       Couleurs alignées sur la palette du site (cream / gold)
       ============================================================ -->

  <defs>
    <!-- Léger dégradé pour donner de la chaleur aux mains -->
    <linearGradient id="handGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE2"/>
      <stop offset="100%" stop-color="#E4D6BC"/>
    </linearGradient>
    <linearGradient id="heartBigGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8902F"/>
      <stop offset="100%" stop-color="#8C6B22"/>
    </linearGradient>
    <linearGradient id="heartSmallGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CB89"/>
      <stop offset="100%" stop-color="#C7A24B"/>
    </linearGradient>
  </defs>

  <!-- Main gauche : paume ouverte vers le haut -->
  <path d="M 78 90
           C 72 60, 50 30, 28 45
           C 8 60, 8 95, 20 125
           C 32 155, 60 175, 85 175
           L 90 175
           L 90 100
           Z"
        fill="url(#handGradient)"
        stroke="#D7C29D"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Main droite : paume ouverte vers le haut -->
  <path d="M 162 90
           C 168 60, 190 30, 212 45
           C 232 60, 232 95, 220 125
           C 208 155, 180 175, 155 175
           L 150 175
           L 150 100
           Z"
        fill="url(#handGradient)"
        stroke="#D7C29D"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Grand cœur (doré foncé) -->
  <path d="M 140 30
           C 140 18, 152 12, 162 18
           C 167 12, 178 12, 186 20
           C 196 30, 196 48, 184 62
           C 174 74, 152 88, 148 90
           C 144 88, 124 74, 114 62
           C 102 48, 102 30, 112 20
           C 120 12, 132 12, 138 18
           C 142 12, 140 22, 140 30 Z"
        fill="url(#heartBigGradient)"/>

  <!-- Petit cœur (doré clair) — devant, légèrement décalé -->
  <path d="M 90 70
           C 90 60, 100 56, 108 62
           C 112 56, 122 56, 128 64
           C 136 72, 136 86, 126 96
           C 118 105, 100 116, 98 117
           C 96 116, 80 105, 72 96
           C 62 86, 62 72, 70 64
           C 76 56, 86 56, 90 62
           C 92 56, 90 64, 90 70 Z"
        fill="url(#heartSmallGradient)"
        stroke="#FBF8F1"
        stroke-width="3"
        stroke-linejoin="round"/>
</svg>
